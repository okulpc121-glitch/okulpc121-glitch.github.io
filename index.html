<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Babuliler Gizli Yazışma</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { border: 2px solid #0f0; padding: 20px; width: 90%; max-width: 600px; box-shadow: 0 0 15px #0f0; }
        #chat-box { background: #111; border: 1px solid #0f0; height: 200px; padding: 15px; overflow-y: auto; margin-bottom: 20px; font-size: 1.2em; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; background: #000; color: #0f0; border: 1px solid #0f0; padding: 12px; outline: none; font-size: 1em; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #fff; }
        .hint { color: #888; font-size: 0.8em; margin-top: 20px; text-align: center; line-height: 1.6; }
        b { color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="text-align: center; letter-spacing: 3px;">BABULİLER SOHBET</h2>
        
        <div id="chat-box">
            </div>
        
        <div class="input-group">
            <input type="text" id="msg" placeholder="Mesajını buraya yaz...">
            <button onclick="mesajOlustur()">GÖNDER</button>
        </div>

        <div class="hint">
            <b>NASIL KULLANILIR?</b><br>
            1. Mesajını yaz ve "GÖNDER"e bas.<br>
            2. Adres çubuğunda oluşan <b>YENİ LİNKİ</b> kopyala.<br>
            3. Bu linki arkadaşına gönder, açtığında mesajını görecek!
        </div>
    </div>

    <script>
        // Sayfa açıldığında linkteki mesajı çözen kısım
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const mesaj = urlParams.get('m');
            const user = urlParams.get('u') || "Anonim";
            
            const chatBox = document.getElementById('chat-box');
            
            if (mesaj) {
                chatBox.innerHTML = `<p style="color:yellow">>>> Gelen Mesaj:</p>
                                     <p><b>[${user}]:</b> ${decodeURIComponent(mesaj)}</p>`;
            } else {
                chatBox.innerHTML = "<p>Sohbet başlatmak için bir mesaj yazıp link oluşturun.</p>";
            }
        };

        function mesajOlustur() {
            const m = document.getElementById('msg').value;
            if (!m) return;

            const u = prompt("Adın ne?");
            if (u) {
                // Mesajı linkin sonuna ekliyoruz (?u=isim&m=mesaj)
                const yeniLink = window.location.origin + window.location.pathname + 
                                "?u=" + encodeURIComponent(u) + "&m=" + encodeURIComponent(m);
                
                // Sayfayı yeni linkle açıyoruz
                window.location.href = yeniLink;
            }
        }
    </script>
</body>
</html>
