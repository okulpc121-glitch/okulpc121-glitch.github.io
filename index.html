<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Babuliler Chat</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; border-bottom: 1px solid #0f0; }
        #input-area { display: flex; padding: 10px; }
        input { flex: 1; background: #000; color: #0f0; border: 1px solid #0f0; padding: 10px; outline: none; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        .msg { margin-bottom: 10px; border-left: 3px solid #0f0; padding-left: 10px; }
        #login { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 10; }
    </style>
</head>
<body>

<div id="login">
    <input type="text" id="nick" placeholder="Takma Adın...">
    <button onclick="giris()">GİR</button>
</div>

<div id="chat"></div>

<div id="input-area">
    <input type="text" id="m" placeholder="Mesaj yazın...">
    <button onclick="gonder()">GÖNDER</button>
</div>

<script>
    let kullanıcı = "";
    
    function giris() {
        kullanıcı = document.getElementById('nick').value;
        if(kullanıcı) document.getElementById('login').style.display = 'none';
    }

    function gonder() {
        const inp = document.getElementById('m');
        if(!inp.value) return;
        
        // Ekrana ekle
        ekranaYaz(kullanıcı, inp.value);
        
        // NOT: MEB engeli yüzünden dış sunucu çalışmıyor. 
        // Arkadaşınla aynı linki paylaştığında mesajın ona gitmesi için 
        // okulun engellemediği bir "backend" gerekir. 
        // Şimdilik bu arayüz hata vermeden çalışacaktır.
        
        inp.value = "";
    }

    function ekranaYaz(kim, ne) {
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<b>${kim}:</b> ${ne}`;
        document.getElementById('chat').appendChild(div);
        document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }
</script>

</body>
</html>
