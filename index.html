<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babuliler Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121212; color: white; overflow: hidden; }

        /* Giriş Ekranı */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #login-screen input { padding: 15px; width: 250px; border-radius: 5px; border: none; margin-bottom: 10px; font-size: 16px; background: #333; color: white; }
        #login-screen button { padding: 10px 20px; background: #00ff00; color: black; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* Başlık Alanı */
        header { background: #1f1f1f; padding: 15px; text-align: center; border-bottom: 1px solid #333; }
        header h2 { color: #00ff00; font-size: 1.2em; letter-spacing: 1px; }
        
        /* Sohbet Alanı (Tam Ekran) */
        #chat-area { height: calc(100vh - 120px); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { background: #2c2c2c; padding: 12px 18px; border-radius: 15px; max-width: 85%; width: fit-content; line-height: 1.4; }
        .msg.me { align-self: flex-end; background: #005c4b; border-bottom-right-radius: 2px; }
        .msg span { font-size: 11px; color: #00ff00; display: block; margin-bottom: 4px; font-weight: bold; }

        /* Mesaj Yazma Çubuğu */
        #input-area { position: fixed; bottom: 0; width: 100%; background: #1f1f1f; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #333; }
        #input-area input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #333; color: white; outline: none; }
        #input-area button { padding: 10px 25px; background: #00ff00; color: black; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="margin-bottom: 20px; color: #00ff00;">Babuliler Chat</h1>
        <input type="text" id="username" placeholder="Adını yaz...">
        <button onclick="login()">Sohbete Başla</button>
    </div>

    <header>
        <h2>BABULİLER GENEL SOHBET</h2>
    </header>

    <div id="chat-area">
        <div class="msg"><span>Sistem</span>Hoş geldin! Mesaj yazmaya başlayabilirsin.</div>
    </div>

    <div id="input-area">
        <input type="text" id="user-msg" placeholder="Mesajınızı buraya yazın..." onkeypress="handleKey(event)">
        <button onclick="sendMsg()">GÖNDER</button>
    </div>

    <script>
        let currentUser = "";

        function login() {
            const user = document.getElementById('username').value;
            if(user.trim() !== "") {
                currentUser = user;
                document.getElementById('login-screen').style.display = 'none';
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMsg();
        }

        function sendMsg() {
            const input = document.getElementById('user-msg');
            const chatArea = document.getElementById('chat-area');
            if(input.value.trim() !== "") {
                const newMsg = document.createElement('div');
                newMsg.className = 'msg me';
                newMsg.innerHTML = `<span>${currentUser}</span>${input.value}`;
                chatArea.appendChild(newMsg);
                input.value = "";
                chatArea.scrollTop = chatArea.scrollHeight;
            }
        }
    </script>
</body>
</html>
