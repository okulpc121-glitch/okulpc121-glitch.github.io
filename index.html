<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Babuliler Chat v3</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; border-bottom: 1px solid #0f0; }
        #input-area { display: flex; padding: 10px; background: #111; }
        input { flex: 1; background: #000; color: #0f0; border: 1px solid #0f0; padding: 12px; outline: none; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; margin-left: 5px; }
        .m { margin-bottom: 8px; font-size: 14px; word-wrap: break-word; }
        .u { color: #fff; font-weight: bold; margin-right: 5px; }
        #login { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

<div id="login">
    <h2 style="color:#0f0">BABULILER CHAT</h2>
    <input type="text" id="nick" placeholder="İsmin nedir?">
    <button onclick="baslat()">SOHBETE GİR</button>
</div>

<div id="chat" id="mesajlar"></div>

<div id="input-area">
    <input type="text" id="msg" placeholder="Mesaj yaz..." onkeypress="if(event.key==='Enter')gonder()">
    <button onclick="gonder()">GÖNDER</button>
</div>

<script>
    // MEB ağında en az takılan ücretsiz veritabanı ayarı
    const config = {
        databaseURL: "https://babuliler-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(config);
    const db = firebase.database().ref("chat");

    let kullanıcı = "";

    function baslat() {
        kullanıcı = document.getElementById('nick').value.trim();
        if(kullanıcı) document.getElementById('login').style.display = 'none';
    }

    function gonder() {
        const inp = document.getElementById('msg');
        if(inp.value.trim() == "") return;
        
        // Veritabanına gönder
        db.push().set({
            u: kullanıcı,
            t: inp.value,
            s: Date.now()
        });
        inp.value = "";
    }

    // Mesajları ANINDA diğer bilgisayarlara ileten kısım
    db.limitToLast(20).on("child_added", (snap) => {
        const data = snap.val();
        const div = document.createElement("div");
        div.className = "m";
        div.innerHTML = `<span class="u">${data.u}:</span> ${data.t}`;
        document.getElementById("chat").appendChild(div);
        document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
    });
</script>
</body>
</html>
